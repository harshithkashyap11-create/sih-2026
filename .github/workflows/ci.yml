name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: insecure-ci-only-not-a-secret
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      POSTGRES_DB: smarana
      POSTGRES_USER: smarana
      POSTGRES_PASSWORD: smarana_ci
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://127.0.0.1:6379/0

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: smarana
          POSTGRES_USER: smarana
          POSTGRES_PASSWORD: smarana_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smarana -d smarana"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install PDF system libraries
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 fonts-dejavu-core fonts-noto-core

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Audit backend dependencies
        run: python -m pip install pip-audit && pip-audit -r requirements.txt

      - name: Lint backend
        run: ruff check . --output-format=github

      - name: Type-check all backend modules and tests
        run: mypy --strict apps config conftest.py manage.py

      - name: Check migrations and Django configuration
        run: |
          python manage.py makemigrations --check --dry-run
          python manage.py check

      - name: Test backend
        run: pytest -q apps config audit_tests/test_deployment_audit.py

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit frontend dependencies
        run: npm audit --audit-level=low

      - name: Lint frontend
        run: npm run lint

      - name: Type-check frontend
        run: npm run typecheck

      - name: Test frontend
        run: |
          npm test -- --run
          npx vitest run --config e2e/deployment.audit.config.ts

      - name: Check locale catalogs and regression checks
        run: |
          npm run i18n:check
          node --test scripts/check-i18n.test.mjs
          npm run copy:check

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Test patient accessibility and offline roundtrip
        run: npx playwright test e2e/a11y.spec.ts e2e/offline.spec.ts e2e/localization.spec.ts

  offline-real:
    name: Real offline backend roundtrip
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      POSTGRES_DB: smarana
      POSTGRES_USER: smarana
      POSTGRES_PASSWORD: smarana_ci
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      SMARANA_REAL_BACKEND: "1"
      VITE_API_PROXY_TARGET: http://127.0.0.1:8000
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: smarana
          POSTGRES_USER: smarana
          POSTGRES_PASSWORD: smarana_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smarana -d smarana"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          cd frontend
          npm ci
          npx playwright install --with-deps chromium
      - name: Install PDF system libraries
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 fonts-dejavu-core fonts-noto-core
      - name: Prepare dedicated demo backend
        working-directory: backend
        run: |
          python manage.py migrate --noinput
          python manage.py seed_demo > /tmp/smarana-demo-setup.txt
          python manage.py runserver 127.0.0.1:8000 --noreload > /tmp/smarana-backend.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/api/v1/health/; then exit 0; fi
            sleep 1
          done
          cat /tmp/smarana-backend.log
          exit 1
      - name: Complete and upload an offline game and reminder
        working-directory: frontend
        run: npx playwright test e2e/offline-real.spec.ts e2e/reports-real.spec.ts e2e/release-real.spec.ts
      - name: Show backend logs on failure
        if: failure()
        run: cat /tmp/smarana-backend.log
